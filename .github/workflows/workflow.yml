name: Publish to TestPyPI

on:
  push:
    tags:
      - 'v*' # Si attiva a ogni push di un tag che inizia per 'v' (es. v0.1.0, v0.2.0)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: Configura l'ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa gli strumenti di build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Compila il pacchetto (sdist e wheel)
        run: python -m build

      - name: Pubblica il pacchetto su TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}