name: Publish to TestPyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: Configura l'ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa gli strumenti di build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Compila il pacchetto (sdist e wheel)
        run: python -m build

      - name: Pubblica il pacchetto su TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/